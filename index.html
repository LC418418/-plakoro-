/* ---------- 地圖生成（Slay the Spire 式） ---------- */
const NODE = { mob:'敵', elite:'精英', rest:'休息', shop:'商人', chest:'寶箱', unknown:'?', boss:'道館' };
function genMap(act){
  const ROWS = 11, W = 5;
  const rows = [];
  for(let r=0;r<ROWS;r++){
    const cnt = r===0 ? 3 : (r===ROWS-1 ? 1 : 2+rnd(3));
    const cols = [];
    while(cols.length<cnt){ const c=rnd(W); if(!cols.includes(c)) cols.push(c); }
    cols.sort((a,b)=>a-b);
    rows.push(cols.map(c=>({ r, c, type:'mob', next:[] })));
  }
  /* 類型分配 */
  rows.forEach((row,r)=>row.forEach(n=>{
    if(r===ROWS-1){ n.type='boss'; return; }
    if(r===0){ n.type='mob'; return; }
    if(r===ROWS-2){ n.type='rest'; return; }
    const roll=rnd(100);
    if(r>=3 && roll<16) n.type='elite';
    else if(roll<28) n.type='unknown';
    else if(roll<38) n.type='rest';
    else if(roll<48) n.type='shop';
    else if(roll<56) n.type='chest';
    else n.type='mob';
  }));
  /* 連線：每個節點至少連一個下層節點，下層每個節點至少有一個上游 */
  for(let r=0;r<ROWS-1;r++){
    const cur=rows[r], nxt=rows[r+1];
    cur.forEach(n=>{
      const cand=nxt.filter(m=>Math.abs(m.c-n.c)<=2).sort((a,b)=>Math.abs(a.c-n.c)-Math.abs(b.c-n.c));
      const pickN = 1+ (cand.length>1 && rnd(100)<45 ? 1 : 0);
      for(let i=0;i<pickN && i<cand.length;i++) if(!n.next.includes(cand[i])) n.next.push(cand[i]);
      if(!n.next.length && nxt.length) n.next.push(nxt[rnd(nxt.length)]);
    });
    nxt.forEach(m=>{
      if(!cur.some(n=>n.next.includes(m))){
        const p=cur.reduce((a,b)=>Math.abs(a.c-m.c)<=Math.abs(b.c-m.c)?a:b);
        p.next.push(m);
      }
    });
  }
  rows.forEach((row,r)=>row.forEach((n,i)=>{ n.id=r+'_'+i; }));
  return { act, rows, cur:null, done:[] };
}

/* ---------- 跑局狀態 ---------- */
/* 由圖鑑編號拎返可用角色卡（官方 12 隻用原裝，其餘生成） */
function cardFor(dex){ return genPlayable(dex); }
const cardOf = mon => cardFor(mon.dex);

function mkPartyMon(pick){
  /* baseDex = 招式同骰組嘅來源（進化之後唔會變，所以 build 要用返佢） */
  const baseDex = pick.baseDex || pick.dex;
  const card = cardFor(baseDex);
  const setIdx = pick.setIdx||0;
  const lo = pick.loadout || defaultLoadout();
  const hp = pick.maxHp || card.hp;
  return mkBattler({
    spec:{ id:card.id, dex:card.dex, name:card.name, type:card.type, weak:card.weak, hp },
    dex: card.dex, baseDex, setIdx,
    deck: pick.deckIdx.map(i=>clone(card.sets[setIdx].moves[i])),
    loadout: lo,
    dice: buildDice(card.id, lo),
    hp: pick.hp!=null ? pick.hp : hp, maxHp: hp,
  });
}

function newRun(partyPicks){
  const party = partyPicks.map(mkPartyMon);
  return {
    diff: DIFF, party, active:0, act:1, gold:100, balls:2, relics:[], reroll:2,
    gymOrder: shuffle(GYMS.slice()).slice(0,4),
    map: genMap(1), floor:0, stage:'map', e4:0,
    log:[], seedTag: Date.now(),
  };
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 遺物效果彙總 */
function relicSum(run){
  const s={maxHp:0,dmgUp:0,dice:0,gold:0,postHeal:0,first:false,startGuard:0,reroll:0,
           freeSwap:false,topBonus:0,revive:0,discount:0,resist:{}};
  run.relics.forEach(r=>{
    if(r.on) for(const k in r.on){
      if(typeof r.on[k]==='boolean') s[k]=s[k]||r.on[k];
      else s[k]+=r.on[k];
    }
    if(r.resist) for(const t in r.resist) s.resist[t]=(s.resist[t]||0)+r.resist[t];
  });
  return s;
}

/* ---------- 敵方隊伍組裝 ---------- */
function buildEnemy(run, kind){
  const act = run.act, a = act-1;
  if(kind==='boss'){
    const g = run.gymOrder[a];
    /* 第 1-2 章道館主只帶 1 隻，第 3-4 章帶 2 隻 */
    let team = act<=2 ? g.team.slice(-1) : g.team;
    if(diffMul().extra && team.length<2) team = g.team;
    return { name:g.name, title:g.title, party:team.map(n=>mkBattler(genMon(n,'gym',a))) };
  }
  if(kind==='e4'){
    const e = ELITE4[run.e4];
    return { name:e.name, title:e.title, party:e.team.map(n=>mkBattler(genMon(n,'e4',3))) };
  }
  if(kind==='champ'){
    return { name:CHAMPION.name, title:CHAMPION.title,
             party:CHAMPION.team.map(n=>mkBattler(genMon(n,'champ',3))) };
  }
  if(kind==='legend'){
    const legs = Object.values(DEX).filter(d=>d.s===4).map(d=>d.n);
    const n = legs[rnd(legs.length)];
    return { name:'傳說寶可夢', title:'神獸挑戰', legend:true,
             party:[mkBattler(genMon(n,'elite',Math.min(3,act)))] };
  }
  const stages = kind==='elite' ? [3] : (act<=1?[1,2]:(act<=2?[1,2,3]:[2,3]));
  const pool = dexPool(stages).filter(d=>d.s<4);
  const n1 = pool[rnd(pool.length)];
  const party=[mkBattler(genMon(n1.n, kind==='elite'?'elite':'mob', a))];
  if(kind==='mob' && act>=3 && rnd(100)<35) party.push(mkBattler(genMon(pool[rnd(pool.length)].n,'mob',a)));
  if(kind==='elite' && act>=2 && rnd(100)<(diffMul().extra?55:(act>=3?40:0))) party.push(mkBattler(genMon(pool[rnd(pool.length)].n,'elite',a)));
  return { name: kind==='elite'?'精英訓練家':'野生寶可夢', title:'', party };
}

/* ---------- 隊伍戰鬥包裝 ---------- */
const aliveOf = side => side.party.filter(m=>m.hp>0);
function activeOf(side){
  if(side.party[side.active] && side.party[side.active].hp>0) return side.party[side.active];
  const i = side.party.findIndex(m=>m.hp>0);
  if(i>=0) side.active=i;
  return side.party[side.active];
}
const ACTIVE_N = 3, PARTY_MAX = 6;
const activeParty = run => run.party.slice(0, ACTIVE_N);

function battleStart(run, enemy){
  const rs = relicSum(run);
  const roster = activeParty(run);
  const mine = { party: roster, active: roster.findIndex(m=>m.hp>0), name:'你' };
  if(mine.active<0) mine.active=0;
  [mine, enemy].forEach(sd=>sd.party.forEach(m=>{
    m.guard=0; m.immune=false; m.pendingDiceMod=0; m.pendingLock=null;
    m.pendingNoChar=false; m.lastMove=null; m.lastSuccess=null;
  }));
  if(rs.startGuard) mine.party.forEach(m=>m.guard += rs.startGuard);
  const first = rs.first ? 0 : rnd(2);
  const g = newGame(activeOf(mine), activeOf(enemy), first);
  g.sides=[mine, enemy]; g.rs=rs; g.usedRevive=0;
  g.fought=new Set([mine.active]);          // 有落過場嘅隊員 index
  return g;
}
const syncActive = g => { g.p[0]=activeOf(g.sides[0]); g.p[1]=activeOf(g.sides[1]); };

/* 出招（包住原本引擎，加隊伍/遺物邏輯） */
function partyTurn(g, moveIdx, lockChoice, seed){
  syncActive(g);
  const atkSide = g.turn, rs = g.rs;
  const before = g.p[1-atkSide].hp;
  seedRNG(seed);
  const L = takeTurn(g, moveIdx, lockChoice);
  unseedRNG();

  /* 遺物加成：PvP 兩邊都計，爬塔淨係玩家（side 0）計 */
  const rsAtk = g.rsFor ? g.rsFor[atkSide] : (atkSide===0 ? rs : null);
  const rsDef = g.rsFor ? g.rsFor[1-atkSide] : (atkSide===1 ? rs : null);
  if(L.success && rsAtk){
    let bonus = rsAtk.dmgUp || 0;
    if(rsAtk.topBonus && L.charRolls.includes('上')) bonus += rsAtk.topBonus;
    if(bonus>0 && L.final>0){
      const def = g.p[1-atkSide];
      const extra = Math.min(bonus, 9999);
      def.hp = Math.max(0, def.hp - extra);
      L.final += extra; L.dmg += extra;
      L.steps.push({msg:`遺物加成 +${extra} 傷害`});
    }
  }
  /* 抗性：受擊方減傷（takeTurn 已經扣咗，補返） */
  if(L.success && rsDef && L.final>0){
    const r = (rsDef.resist||{})[L.move.type] || 0;
    if(r>0){
      const def = g.p[1-atkSide];
      const give = Math.min(r, L.final);
      def.hp = Math.min(def.maxHp, def.hp + give);
      L.steps.push({msg:`${TYPES[L.move.type].n}抗體 −${give} 傷害`});
      L.final -= give;
    }
  }

  L.faint = [];
  g.sides.forEach((sd,i)=>{
    const m = sd.party[sd.active];
    if(m && m.hp<=0){
      L.faint.push({side:i, mon:m});
      if(i===0 && g.rs.revive && g.usedRevive < g.rs.revive){
        m.hp = Math.round(m.maxHp*0.3); g.usedRevive++;
        L.steps.push({msg:`再生種子：${m.spec.name} 以 ${m.hp} HP 復活`});
        L.faint.pop();
      }
    }
  });
  g.over=false; g.winner=null;
  const a0=aliveOf(g.sides[0]).length, a1=aliveOf(g.sides[1]).length;
  if(a0===0 || a1===0){ g.over=true; g.winner = a1===0 ? (a0===0?-1:0) : 1; }
  else { syncActive(g); if(g.fought) g.fought.add(g.sides[0].active); }
  return L;
}
/* 換人：消耗一個回合（除非有交換球） */
function partySwitch(g, side, idx){
  const sd=g.sides[side];
  if(!sd.party[idx] || sd.party[idx].hp<=0 || idx===sd.active) return false;
  sd.active=idx; syncActive(g);
  if(side===0 && g.fought) g.fought.add(idx);
  if(!(side===0 && g.rs.freeSwap)){ g.turnNo++; g.turn=1-g.turn; }
  return true;
}

/* ---------- 敵人 AI ---------- */
function enemyChoose(g){
  const me=g.p[1], op=g.p[0];
  const ok=[];
  me.deck.forEach((m,i)=>{
    if(me.lastMove && me.lastMove.name===m.name) return;
    if(me.pendingLock===m.name) return;
    /* 期望值：命中率 × (傷害 + 角色骰期望) ，打弱點加權 */
    let hit=0; const N=400;
    for(let k=0;k<N;k++){
      const e=[]; for(let d=0;d<3;d++) e.push(...me.dice[d][Math.floor(Math.random()*6)]);
      if(payCost(m.cost,e)) hit++;
    }
    const p=hit/N;
    const face=(m.faces&&m.faces[0])||{f:'',ops:[]};
    const add=(face.ops.find(o=>o.t==='add')||{}).v||0;
    const ev=p*((m.dmg||0) + add*(face.f.length/6) + (m.type===op.spec.weak?20:0));
    ok.push({i, ev});
  });
  if(!ok.length) return 0;
  ok.sort((a,b)=>b.ev-a.ev);
  /* 八成揀最好，兩成隨機，唔好太機械 */
  return (Math.random()<0.8 ? ok[0] : ok[rnd(ok.length)]).i;
}
/* 血少過三成就考慮換人 */
function enemyMaybeSwitch(g){
  const sd=g.sides[1], m=sd.party[sd.active];
  if(aliveOf(sd).length<2) return -1;
  if(m.hp/m.maxHp > 0.25) return -1;
  const alt=sd.party.findIndex((x,i)=>i!==sd.active && x.hp>0 && x.hp/x.maxHp>0.5);
  return (alt>=0 && Math.random()<0.5) ? alt : -1;
}

/* 打贏之後自動回復（寶可夢中心式），避免純消耗戰 */
const POST_FIGHT_HEAL = 0.10;      // 最大HP 百分比
const REST_HEAL = 0.35;
const BADGE_HP = 20;
const E4_HEAL = 0.15;              // 四天王之間嘅小回復               // 每打低一個道館主，全隊最大HP +20
function earnBadge(run){
  const k = diffMul().heal;
  run.party.forEach(m=>{
    m.maxHp += BADGE_HP;
    m.hp = m.hp<=0 ? Math.round(m.maxHp*0.5) : Math.min(m.maxHp, m.hp + Math.round(m.maxHp*0.45*k));
  });
}
/* 每場勝利：加球、參戰隊員記一場 */
function afterWin(run, foughtIdx){
  run.balls = (run.balls||0) + BALL_PER_WIN;
  (foughtIdx||[]).forEach(i=>{
    const m = run.party[i];
    if(m) m.wins = (m.wins||0) + 1;
  });
}

function postFightRecover(run){
  const rs = relicSum(run), k = diffMul().heal;
  run.party.forEach((m,i)=>{
    if(m.hp<=0) return;
    const f = i<ACTIVE_N ? 1 : benchFactor;
    m.hp = Math.min(m.maxHp, m.hp + Math.round((m.maxHp*POST_FIGHT_HEAL*k + (rs.postHeal||0))*f));
  });
}
const restHeal = m => Math.round(m.maxHp * REST_HEAL * diffMul().heal);
/* 後備都會回血，但只有一半效率 */
const benchFactor = 0.5;

/* ---------- 精靈球捕捉 ---------- */
const ENCOUNTER_RATE = { mob:0.55, elite:0.75, boss:0, e4:0, champ:0, legend:1 };
const BALL_PER_WIN   = 1;      // 每場勝利拎幾多個球
const CATCH_BASE     = 0.50;   // 基礎命中率
const MAX_MISS       = 5;      // 連續失敗幾多次就走甩
/* 按進化階級／神獸調低 */
function catchRate(dex){
  const d = DEX[dex]; if(!d) return 0;
  if(d.s === 4) return CATCH_BASE * 0.20;          // 神獸 10%
  const stage = evoStagesLeft(dex);               // 仲可以進化幾多階
  const f = stage >= 2 ? 1.0 : (stage === 1 ? 0.70 : 0.50);
  return CATCH_BASE * f;                           // 50% / 35% / 25%
}
/* 打贏之後有機會遇到可捕捉目標（唔係必中，要投球） */
function catchOffer(run, enemy, kind){
  const rate = (ENCOUNTER_RATE[kind]||0) * (diffMul().catch||1);
  if(kind!=='legend' && Math.random() > rate) return null;
  const pool = kind==='legend' ? enemy.party
             : enemy.party.filter(m=>DEX[m.spec.dex] && DEX[m.spec.dex].s<4);
  if(!pool.length) return null;
  const target = pool[rnd(pool.length)];
  return makeRecruit(run, target.spec.dex);
}
/* 投一個球：回傳 'caught' | 'miss' | 'flee' | 'noball' */
function throwBall(run, state){
  if(run.balls <= 0) return 'noball';
  run.balls--;
  state.tries = (state.tries||0) + 1;
  if(Math.random() < catchRate(state.dex)){ return 'caught'; }
  state.miss = (state.miss||0) + 1;
  return state.miss >= MAX_MISS ? 'flee' : 'miss';
}
/* 用隊伍平均血量做基準，新隊員唔會落後太多，但只有一半血 */
function makeRecruit(run, dex){
  const card = cardFor(dex);
  const avgMax = Math.round(run.party.reduce((a,b)=>a+b.maxHp,0) / Math.max(1,run.party.length));
  const maxHp = Math.max(card.hp, avgMax);
  const dice = buildDice(card.id, defaultLoadout());
  const scored = card.sets[0].moves.map((m,i)=>{
    let ok=0; for(let k=0;k<600;k++){
      const e=[]; for(let d=0;d<3;d++) e.push(...dice[d][Math.floor(Math.random()*6)]);
      if(payCost(m.cost,e)) ok++; }
    const f=(m.faces&&m.faces[0])||{f:'',ops:[]};
    const add=(f.ops.find(o=>o.t==='add')||{}).v||0;
    return { i, ev:(ok/600)*((m.dmg||0)+add*(f.f.length/6)) };
  }).sort((a,b)=>b.ev-a.ev);
  return mkPartyMon({ dex, setIdx:0, deckIdx: scored.slice(0,4).map(x=>x.i),
                      loadout: defaultLoadout(), maxHp, hp: Math.round(maxHp*0.5) });
}
function addToParty(run, mon, replaceIdx){
  if(run.party.length < PARTY_MAX){ run.party.push(mon); return true; }
  if(replaceIdx==null) return false;
  run.party[replaceIdx] = mon; return true;
}
/* 出戰／後備調位 */
function swapParty(run, a, b){
  if(a<0||b<0||a>=run.party.length||b>=run.party.length) return false;
  const t=run.party[a]; run.party[a]=run.party[b]; run.party[b]=t; return true;
}

/* ---------- 獎勵 ---------- */
function goldFor(kind, act){
  const base={mob:[28,36,44,52],elite:[70,85,100,115],boss:[130,150,170,190],e4:[160,160,160,160],champ:[0,0,0,0]}[kind];
  return Math.round((base[Math.min(3,act-1)]||30) * (0.85+Math.random()*0.3));
}
/* 招式升級選項 */
function moveUpgrades(run){
  const out=[];
  run.party.forEach((mon,pi)=>mon.deck.forEach((mv,mi)=>{
    if(mv.plus>=2) return;
    out.push({ kind:'move', pi, mi,
      n:`${mon.spec.name}：${mv.name} 強化`,
      d: mv.dmg==null ? '角色骰效果數值 +10' : `基本傷害 +10、角色骰加成 +10`,
      apply(run){
        const m=run.party[pi].deck[mi];
        m.plus=(m.plus||0)+1;
        if(m.dmg!=null) m.dmg+=10;
        (m.faces||[]).forEach(f=>f.ops.forEach(o=>{
          if(o.t==='add'||o.t==='heal'||o.t==='guard') o.v+=10;
        }));
        m.name = m.name.replace(/\+*$/,'') + '+'.repeat(m.plus);
      }});
  }));
  return out;
}
/* 新招式（由自己嗰隻寶可夢未帶嘅卡入面揀） */
function moveAdds(run){
  const out=[];
  run.party.forEach((mon,pi)=>{
    if(mon.deck.length>=6) return;
    const all=cardOf(mon).sets[mon.setIdx].moves;
    all.forEach((mv,i)=>{
      if(mon.deck.some(d=>d.name.replace(/\+/g,'')===mv.name)) return;
      out.push({ kind:'add', pi, n:`${mon.spec.name}：學識「${mv.name}」`,
        d:`${mv.dmg==null?'—':mv.dmg+' 傷害'}・${mv.cost.length} 能量`,
        apply(run){ run.party[pi].deck.push(clone(mv)); }});
    });
  });
  return out;
}
/* 骰晶片升級 */
function chipUpgrades(run){
  const out=[];
  run.party.forEach((mon,pi)=>{
    const D=DICE[cardOf(mon).id];
    const used=new Set(mon.loadout.flat());
    const free=D.chips.map((c,i)=>i).filter(i=>!used.has(i));
    if(!free.length) return;
    const ci=free[rnd(free.length)];
    out.push({ kind:'chip', pi, ci,
      n:`${mon.spec.name}：換上 ${D.chips[ci]} 晶片`,
      d:'揀一格骰面換走（之後喺骰子工房都改得）',
      apply(run, opt){
        const m=run.party[pi];
        const d=opt&&opt.die!=null?opt.die:0, s=opt&&opt.slot!=null?opt.slot:0;
        m.loadout[d][s]=ci;
        m.dice=buildDice(cardOf(m).id, m.loadout);
      }});
  });
  return out;
}
function relicRewards(run, n){
  const owned=new Set(run.relics.map(r=>r.id));
  const pool=ALL_RELICS.filter(r=>!owned.has(r.id));
  const out=[];
  while(out.length<n && pool.length){
    const r=pool.splice(rnd(pool.length),1)[0];
    out.push({ kind:'relic', n:r.n, d:r.d, relic:r,
      apply(run){ run.relics.push(r);
        const s=relicSum(run);
        if(r.on&&r.on.maxHp) run.party.forEach(m=>{ m.maxHp+=r.on.maxHp; m.hp=Math.min(m.maxHp,m.hp+r.on.maxHp); });
        if(r.on&&r.on.reroll) run.reroll+=r.on.reroll;
      }});
  }
  return out;
}
/* 一次獎勵：3 選 1 */
function rollRewards(run, kind){
  const bag=[];
  const mu=moveUpgrades(run), ma=moveAdds(run), cu=chipUpgrades(run);
  const push=(arr,k)=>{ if(arr.length) bag.push(arr[rnd(arr.length)]); };
  push(mu); push(ma); push(cu);
  bag.push(...relicRewards(run, kind==='boss'||kind==='elite'?2:1));
  shuffle(bag);
  return bag.slice(0,3);
}
</script>
<script>/* ============================================================
   v4.2：爬塔存檔 + 戰力值 + PvP 快照
   本機自動存（localStorage），登入之後同步上雲
   ============================================================ */

const SAVE_KEY = 'plakoro.run';
const SAVE_VER = 2;

/* ---------- 序列化 ----------
   地圖節點之間係物件參照，JSON 化會爆／重複，所以 next 轉做 id 陣列 */
function serializeRun(run){
  if(!run) return null;
  return {
    v: SAVE_VER, ts: Date.now(),
    diff: run.diff, act: run.act, gold: run.gold, balls: run.balls,
    reroll: run.reroll, e4: run.e4 || 0, active: run.active || 0,
    gymOrder: run.gymOrder.map(g=>GYMS.findIndex(x=>x.name===g.name)),
    relics: run.relics.map(r=>r.id),
    party: run.party.map(m=>({
      dex: m.dex, baseDex: m.baseDex || m.dex, setIdx: m.setIdx,
      hp: m.hp, maxHp: m.maxHp,
      wins: m.wins||0, evoStage: m.evoStage||0,
      loadout: m.loadout,
      deck: m.deck,                       // 招式已經升過級，要原樣存返
    })),
    map: {
      act: run.map.act,
      rows: run.map.rows.map(row=>row.map(n=>({
        r:n.r, c:n.c, type:n.type, id:n.id, next:n.next.map(t=>t.id)
      }))),
      cur: run.map.cur ? run.map.cur.id : null,
      done: run.map.done.slice(),
    },
  };
}

function deserializeRun(s){
  if(!s || s.v !== SAVE_VER) return null;
  try{
    /* 地圖：先起返所有節點，再用 id 駁返連線 */
    const byId = {};
    const rows = s.map.rows.map(row=>row.map(n=>{
      const node = { r:n.r, c:n.c, type:n.type, id:n.id, next:[] };
      byId[n.id] = node; return node;
    }));
    s.map.rows.forEach(row=>row.forEach(n=>{
      n.next.forEach(id=>{ if(byId[id]) byId[n.id].next.push(byId[id]); });
    }));

    const party = s.party.map(p=>{
      const base = p.baseDex || p.dex;
      const mon = mkPartyMon({ dex:base, baseDex:base, setIdx:p.setIdx, deckIdx:[0],
                               loadout:p.loadout, maxHp:p.maxHp, hp:p.hp });
      mon.dex = p.dex;                    // 進化後嘅外觀
      mon.deck = p.deck;                  // 用返存檔嗰套（含強化／進化加成）
      mon.wins = p.wins; mon.evoStage = p.evoStage;
      /* 進化過嘅要換返外觀同弱點 */
      const d = DEX[p.dex];
      if(d) mon.spec = { ...mon.spec, id:'D'+p.dex, dex:p.dex, name:d.name, weak:d.weak, type:d.type };
      return mon;
    });

    return {
      diff: s.diff, party, active: s.active, act: s.act,
      gold: s.gold, balls: s.balls, reroll: s.reroll, e4: s.e4,
      relics: s.relics.map(id=>ALL_RELICS.find(r=>r.id===id)).filter(Boolean),
      gymOrder: s.gymOrder.map(i=>GYMS[i]).filter(Boolean),
      map: { act:s.map.act, rows, cur: s.map.cur ? byId[s.map.cur] : null,
             done: s.map.done.slice() },
      stage:'map', log:[], seedTag: s.ts,
    };
  }catch(e){ console.log('存檔讀取失敗', e); return null; }
}

/* ---------- 本機 ---------- */
function saveLocal(run){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serializeRun(run))); return true; }
  catch(e){ return false; }
}
function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; }
}
function clearLocal(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---------- 雲端（登入先有） ---------- */
async function saveCloud(run){
  if(!FB.user) return false;
  try{ await FB.db.ref('users/'+FB.user.uid+'/run').set(serializeRun(run)); return true; }
  catch(e){ return false; }
}
async function loadCloud(){
  if(!FB.user) return null;
  try{ const s = await FB.db.ref('users/'+FB.user.uid+'/run').get(); return s.val(); }
  catch(e){ return null; }
}
async function clearCloud(){
  if(!FB.user) return;
  try{ await FB.db.ref('users/'+FB.user.uid+'/run').remove(); }catch(e){}
}

/* 自動存檔：本機即刻，雲端背景（唔阻住玩） */
function autosave(run){
  if(!run) return;
  saveLocal(run);
  if(FB.user) saveCloud(run).catch(()=>{});
}
/* 攞最新存檔：雲端同本機邊個新用邊個 */
async function bestSave(){
  const loc = loadLocal();
  let cl = null;
  if(FB.user){ try{ cl = await loadCloud(); }catch(e){} }
  if(loc && cl) return (cl.ts||0) > (loc.ts||0) ? cl : loc;
  return cl || loc;
}
const saveSummary = s => !s ? null : {
  act: s.act, diff: (DIFFS[s.diff]||{}).n || '?',
  party: (s.party||[]).map(p=>(DEX[p.dex]||{}).name).filter(Boolean),
  when: s.ts,
};

/* ============================================================
   戰力值：畀人一眼比較兩個爬塔進度
   = 出戰 3 隻嘅（最大HP + 最強一招期望傷害×6）+ 遺物 + 徽章
   ============================================================ */
function monPowerScore(mon){
  let best = 0;
  (mon.deck||[]).forEach(mv=>{
    let ok = 0; const N = 400;
    for(let k=0;k<N;k++){
      const e=[]; for(let d=0;d<3;d++) e.push(...mon.dice[d][Math.floor(Math.random()*6)]);
      if(payCost(mv.cost, e)) ok++;
    }
    const f = (mv.faces && mv.faces[0]) || {f:'', ops:[]};
    const add = (f.ops.find(o=>o.t==='add')||{}).v || 0;
    best = Math.max(best, (ok/N) * ((mv.dmg||0) + add*(f.f.length/6)));
  });
  return Math.round(mon.maxHp + best*6);
}
function teamPower(run){
  const act = (run.party||[]).slice(0, ACTIVE_N);
  const mons = act.reduce((a,m)=>a + monPowerScore(m), 0);
  return Math.round(mons + (run.relics||[]).length*25 + ((run.act||1)-1)*40);
}

/* ---------- PvP 快照：全滿血 ---------- */
function battleSnapshot(run, nick){
  const roster = run.party.slice(0, ACTIVE_N);
  return {
    nick: nick || '訓練家',
    act: run.act, diff: run.diff,
    power: teamPower(run),
    relics: (run.relics||[]).map(r=>r.id),
    party: roster.map(m=>({
      dex: m.dex, baseDex: m.baseDex || m.dex, setIdx: m.setIdx, maxHp: m.maxHp,
      evoStage: m.evoStage||0, wins: m.wins||0,
      loadout: m.loadout, deck: m.deck,
    })),
  };
}
/* 由快照起返一隊（滿血） */
function partyFromSnapshot(snap){
  return (snap.party||[]).map(p=>{
    const base = p.baseDex || p.dex;
    const mon = mkPartyMon({ dex:base, baseDex:base, setIdx:p.setIdx, deckIdx:[0],
                             loadout:p.loadout, maxHp:p.maxHp, hp:p.maxHp });
    mon.dex = p.dex;
    mon.deck = p.deck; mon.evoStage = p.evoStage; mon.wins = p.wins;
    const d = DEX[p.dex];
    if(d) mon.spec = { ...mon.spec, id:'D'+p.dex, dex:p.dex, name:d.name, weak:d.weak, type:d.type };
    return mon;
  });
}
/* PvP 用嘅遺物效果（只計被動數值，唔計商店／獎勵類） */
function snapshotRelics(snap){
  return (snap.relics||[]).map(id=>ALL_RELICS.find(r=>r.id===id)).filter(Boolean);
}

<script>/* ============================================================
   v4.2：爬塔隊伍 PvP（3v3、可換人、房間碼實時對戰）
   同步做法同 1v1 一樣：雙方送出「動作 + 亂數種子」，各自跑同一套引擎
   ============================================================ */

/* 由兩份快照起一場 PvP（滿血） */
function pvpStart(setup){
  const mk = snap => {
    const party = partyFromSnapshot(snap);
    return { party, active:0, name: snap.nick || '訓練家',
             relics: snapshotRelics(snap) };
  };
  const a = mk(setup.p0), b = mk(setup.p1);
  [a,b].forEach(sd=>sd.party.forEach(m=>{
    m.hp = m.maxHp; m.guard=0; m.immune=false;
    m.pendingDiceMod=0; m.pendingLock=null; m.pendingNoChar=false;
    m.lastMove=null; m.lastSuccess=null; m.wins=m.wins||0;
  }));
  /* 遺物：只計對戰入面有意義嗰啲 */
  const rsOf = sd => {
    const s = { maxHp:0,dmgUp:0,dice:0,gold:0,postHeal:0,first:false,startGuard:0,
                reroll:0,freeSwap:false,topBonus:0,revive:0,discount:0,resist:{} };
    sd.relics.forEach(r=>{
      if(r.on) for(const k in r.on){
        if(typeof r.on[k]==='boolean') s[k]=s[k]||r.on[k]; else s[k]+=r.on[k];
      }
      if(r.resist) for(const t in r.resist) s.resist[t]=(s.resist[t]||0)+r.resist[t];
    });
    return s;
  };
  a.rs = rsOf(a); b.rs = rsOf(b);
  if(a.rs.startGuard) a.party.forEach(m=>m.guard += a.rs.startGuard);
  if(b.rs.startGuard) b.party.forEach(m=>m.guard += b.rs.startGuard);

  const first = setup.first || 0;
  const g = newGame(a.party[0], b.party[0], first);
  g.sides=[a,b]; g.rs=a.rs; g.rsB=b.rs; g.rsFor=[a.rs,b.rs]; g.usedRevive=0; g.usedReviveB=0;
  g.pvp = true;
  g.fought = new Set([0]);
  return g;
}

/* PvP 一步：type 'move' 或 'switch' */
function pvpStep(g, act){
  if(act.type === 'switch'){
    const side = g.turn;
    const free = (side===0 ? g.rs : g.rsB).freeSwap;
    const sd = g.sides[side];
    if(!sd.party[act.idx] || sd.party[act.idx].hp<=0 || act.idx===sd.active) return null;
    sd.active = act.idx;
    g.p[0]=g.sides[0].party[g.sides[0].active];
    g.p[1]=g.sides[1].party[g.sides[1].active];
    if(!free){ g.turnNo++; g.turn = 1-g.turn; }
    return { switched:true, side, idx:act.idx, name:sd.party[act.idx].spec.name };
  }
  /* 出招：借用爬塔嗰套 partyTurn，但兩邊都要食自己遺物 */
  const atk = g.turn;
  const rsMe = atk===0 ? g.rs : g.rsB;
  if(rsMe.dice) g.p[atk].pendingDiceMod += rsMe.dice;
  const saveRs = g.rs;
  g.rs = rsMe;                       // 復活／換人免費呢類要睇出手嗰邊
  const L = partyTurn(g, act.moveIdx, act.lockChoice, act.seed);
  g.rs = saveRs;
  return L;
}

/* 由 action log 重播成個 PvP（斷線重連 / 觀戰） */
function pvpReplay(setup, actions){
  const g = pvpStart(setup);
  const logs = [];
  (actions||[]).forEach(a=>{
    if(g.over) return;
    logs.push(pvpStep(g, a));
  });
  return { game:g, logs };
}

/* 勝負：邊一方三隻全倒 */
function pvpWinner(g){
  const a = g.sides[0].party.some(m=>m.hp>0);
  const b = g.sides[1].party.some(m=>m.hp>0);
  if(a && b) return null;
  if(!a && !b) return -1;
  return a ? 0 : 1;
}

<script>/* ===================== ROGUELIKE 介面 ===================== */
function dexURL(n){ return 'data:image/png;base64,'+(DEXSPR[n]||DEXSPR[1]); }
function monURL(spec){ return dexURL(spec.dex); }

let R = { run:null, g:null, node:null, kind:null, busy:false, rewards:[], chipPick:null, shop:null };

const NODE_ICON = { mob:'⚔️', elite:'💀', rest:'🔥', shop:'🛒', chest:'🎁', unknown:'❓', boss:'🏆' };
const NODE_NAME = { mob:'野生寶可夢', elite:'精英訓練家', rest:'篝火', shop:'商人', chest:'寶箱', unknown:'未知', boss:'道館主' };

/* ---------------- 開局抽卡（3 輪 3 選 1） ---------------- */
let RT = { round:0, cands:[], picks:[], sel:null, deck:[], seen:[] };
const DRAFT_ROUNDS = 3;

function rgStart(){ RT={round:0,cands:[],picks:[],sel:null,deck:[],seen:[]}; rollCands(); renderRgTeam(); show('rgTeam'); }
function rollCands(){
  /* 第 1 抽固定御三家；之後只出未進化嘅基礎精靈（唔出進化型同神獸） */
  if(RT.round===0){ RT.cands=STARTERS.slice(); RT.sel=null; RT.deck=[]; return; }
  const taken=new Set(RT.seen);
  const pool=[];
  for(let n=1;n<=151;n++){
    if(taken.has(n)) continue;
    if(!isBasic(n)) continue;          // 進化型 + 神獸都排除
    if(STARTERS.includes(n)) continue; // 御三家淨係第 1 抽出
    pool.push(n);
  }
  const out=[];
  while(out.length<3 && pool.length) out.push(pool.splice(rnd(pool.length),1)[0]);
  RT.cands=out; RT.sel=null; RT.deck=[];
}
function monPreviewHTML(dex){
  const card=cardFor(dex), d=DEX[dex];
  const mv=card.sets[0].moves;
  return `<div class="draftCard" data-dx="${dex}">
    <img class="spr big" src="${dexURL(dex)}">
    <div class="dn">${card.name}${d.s===4?'<span class="badge">傳說</span>':''}${officialPkIdx(dex)>=0?'<span class="badge off">官方卡</span>':''}${evoStagesLeft(dex)?`<span class="badge evo">可進化 ${evoStagesLeft(dex)} 階</span>`:''}</div>
    <div class="xs">${tyBadge(card.type,1)} HP${card.hp} <span class="mut">弱</span>${tyBadge(card.weak,1)}</div>
    <div class="mvmini">${mv.slice(0,4).map(m=>`<span>${tyBadge(m.type,1)}${esc(m.name)} <b>${m.dmg==null?'—':m.dmg}</b></span>`).join('')}</div>
  </div>`;
}
function renderRgTeam(){
  const box=$('#rgTeamBody');
  if(RT.sel==null){
    box.innerHTML=`${RT.round===0?`<div class="mut" style="margin-bottom:5px">難度</div>
      <div class="diffRow">${DIFFS.map((d,i)=>`<button class="diffBtn${i===DIFF?' on':''}" data-df="${i}">${d.n}</button>`).join('')}</div>
      <div class="mut xs mb">${esc(DIFFS[DIFF].d)}</div>`:''}
      <div class="draftHead">第 ${RT.round+1} / ${DRAFT_ROUNDS} 抽　<span class="mut">${RT.round===0?'御三家，三選一':'基礎精靈三選一'}</span></div>
      <div class="teamRow mb">${RT.picks.map(p=>`<div class="tslot"><img class="spr" src="${dexURL(p.dex)}">
        <div class="xs">${cardFor(p.dex).name}</div></div>`).join('') || '<div class="mut xs">未有隊員</div>'}</div>
      ${RT.cands.map(monPreviewHTML).join('')}`;
    $$('#rgTeamBody [data-df]').forEach(b=>b.onclick=()=>{ DIFF=+b.dataset.df; renderRgTeam(); });
    $$('#rgTeamBody .draftCard').forEach(b=>b.onclick=()=>{
      RT.sel=+b.dataset.dx;
      const mv=cardFor(RT.sel).sets[0].moves;
      RT.deck = bestFour(RT.sel);
      renderRgTeam();
    });
    $('#rgTeamGo').disabled=true;
    $('#rgTeamGo').textContent='撳一隻加入';
    return;
  }
  /* 揀 4 張招式（已經幫你預選咗最好嗰 4 張） */
  const card=cardFor(RT.sel), moves=card.sets[0].moves;
  box.innerHTML=`<div class="row mb"><img class="spr big" src="${dexURL(RT.sel)}">
      <div><b>${card.name}</b> ${tyBadge(card.type,1)}<br>
      <span class="mut xs">揀 4 張帶入戰鬥（已幫你預選，可以改）</span></div></div>
    <div id="rgMv"></div>`;
  const mb=box.querySelector('#rgMv');
  moves.forEach((m,i)=>{
    const d=el('div','mv'+(RT.deck.includes(i)?' sel':'')); d.innerHTML=moveCardHTML(m);
    d.onclick=()=>{ const k=RT.deck.indexOf(i); if(k>=0) RT.deck.splice(k,1); else if(RT.deck.length<4) RT.deck.push(i); renderRgTeam(); };
    mb.appendChild(d);
  });
  $('#rgTeamGo').disabled = RT.deck.length!==4;
  $('#rgTeamGo').textContent = RT.deck.length===4
    ? (RT.round>=DRAFT_ROUNDS-1 ? '出發！' : '確定，下一抽')
    : `仲要揀 ${4-RT.deck.length} 張`;
}
/* 按命中率×傷害揀最好嘅 4 張 */
function bestFour(dex){
  const card=cardFor(dex), dice=buildDice(card.id, defaultLoadout());
  return card.sets[0].moves.map((m,i)=>{
    let ok=0; for(let k=0;k<700;k++){ const e=[]; for(let d=0;d<3;d++) e.push(...dice[d][Math.floor(Math.random()*6)]);
      if(payCost(m.cost,e)) ok++; }
    const f=(m.faces&&m.faces[0])||{f:'',ops:[]};
    const add=(f.ops.find(o=>o.t==='add')||{}).v||0;
    return {i, ev:(ok/700)*((m.dmg||0)+add*(f.f.length/6)+20)};
  }).sort((a,b)=>b.ev-a.ev).slice(0,4).map(x=>x.i);
}

/* ---------------- 地圖 ---------------- */
const MAP_COL=64, MAP_ROW=66, MAP_COLS=5, MAP_NODE=46;
const mapX = c => c*MAP_COL + MAP_COL/2;
const mapY = (r, rows) => (rows-1-r)*MAP_ROW + MAP_ROW/2;

function renderMap(){
  const run=R.run, m=run.map, rows=m.rows.length;
  const gym=run.gymOrder[run.act-1];
  $('#rgActTitle').innerHTML=`第 ${run.act} 章　<span class="mut">${DIFFS[run.diff].n}</span><br>
    <span class="mut xs">道館主：${gym.name}（${gym.title}）</span>`;
  renderPartyBar('#rgMapParty');
  $$('#rgMapParty .pmon').forEach(b=>b.onclick=()=>openPartyManage(+b.dataset.mi));
  $('#rgGold').textContent=run.gold;
  const bl=$('#rgBalls'); if(bl) bl.textContent=run.balls||0;
  $('#rgRelics').innerHTML = run.relics.length
    ? run.relics.map(r=>`<button class="relic" title="${esc(r.d)}" data-rid="${r.id}">${esc(r.n[0])}</button>`).join('')
    : '<span class="mut xs">未有遺物</span>';
  $$('#rgRelics .relic').forEach(b=>b.onclick=()=>{
    const r=run.relics.find(x=>x.id===b.dataset.rid);
    sheetOpen(`<h2>${esc(r.n)}</h2><div class="mut">${esc(r.d)}</div>
      <button class="btn sec sm mt" id="rlClose">關閉</button>`);
    $('#rlClose').onclick=sheetClose;
  });

  const doneSet=new Set(m.done);
  const started=m.cur!==null;
  const nextNodes = started ? (m.cur.next||[]) : m.rows[0];
  const canSet=new Set(nextNodes.map(n=>n.id));
  const bossNode=m.rows[rows-1][0];

  const W=MAP_COLS*MAP_COL, H=rows*MAP_ROW + MAP_ROW;   // 底部留位畀起點
  const startY = mapY(0,rows) + MAP_ROW;

  /* ---- 連線（只畫已走過 + 眼前可選） ---- */
  const lines=[];
  if(!started){
    nextNodes.forEach(t=>lines.push(
      `<line class="ln open" x1="${W/2}" y1="${startY}" x2="${mapX(t.c)}" y2="${mapY(t.r,rows)}"/>`));
  }
  m.rows.flat().forEach(n=>{
    if(!doneSet.has(n.id)) return;
    n.next.forEach(t=>{
      const cls = doneSet.has(t.id) ? 'ln walked' : (canSet.has(t.id) ? 'ln open' : null);
      if(!cls) return;
      lines.push(`<line class="${cls}" x1="${mapX(n.c)}" y1="${mapY(n.r,rows)}" x2="${mapX(t.c)}" y2="${mapY(t.r,rows)}"/>`);
    });
  });

  /* ---- 節點（迷霧：只顯示走過嘅、眼前可選嘅、同埋最頂道館主） ---- */
  const nodes=[];
  m.rows.flat().forEach(n=>{
    const done=doneSet.has(n.id), can=canSet.has(n.id), isCur=started&&m.cur.id===n.id;
    const isBoss=n===bossNode;
    if(!done && !can && !isBoss) return;                       // 未揭開 → 唔畫
    const x=mapX(n.c)-MAP_NODE/2, y=mapY(n.r,rows)-MAP_NODE/2;
    const locked = isBoss && !can && !done;
    nodes.push(`<button class="mn ${n.type}${can?' can':''}${done?' done':''}${isCur?' cur':''}${locked?' locked':''}"
      style="left:${x}px;top:${y}px" data-id="${n.id}" ${can?'':'disabled'}
      title="${NODE_NAME[n.type]}"><span class="ic">${locked?'🔒':NODE_ICON[n.type]}</span></button>`);
  });

  /* ---- 未揭開嘅層：擺個問號提示仲有幾多層 ---- */
  const curRow = started ? m.cur.r : -1;
  const ticks=[];
  for(let r=0;r<rows;r++){
    const revealed = r<=curRow+1 || r===rows-1;
    ticks.push(`<div class="tick${r===curRow?' on':''}" style="top:${mapY(r,rows)-9}px">
      ${revealed?'':'<span class="fog">?</span>'}<b>${r+1}</b></div>`);
  }

  $('#rgMapGrid').innerHTML=`
    <div class="mapCanvas" style="width:${W}px;height:${H}px">
      <div class="ticks">${ticks.join('')}</div>
      <svg class="mapLines" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${lines.join('')}</svg>
      ${!started?`<div class="startDot" style="left:${W/2-9}px;top:${startY-9}px"></div>`:''}
      ${nodes.join('')}
    </div>`;
  $$('#rgMapGrid .mn[data-id]').forEach(b=>b.onclick=()=>{
    const [r,i]=b.dataset.id.split('_').map(Number);
    enterNode(m.rows[r][i]);
  });
  const foc=$('#rgMapGrid .mn.can') || $('#rgMapGrid .mn.cur');
  try{ if(foc && foc.scrollIntoView) foc.scrollIntoView({block:'center'}); }catch(e){}
}
function monChip(m, i, extra){
  const dead=m.hp<=0;
  return `<button class="pmon${dead?' dead':''}${extra||''}" data-mi="${i}">
    <img class="spr" src="${monURL(m.spec)}">
    <div class="xs">${tyBadge(m.spec.type,1)}</div>
    <div class="hpbar tiny"><i style="width:${Math.max(0,m.hp/m.maxHp*100)}%"></i></div>
    <div class="xs">${Math.max(0,m.hp)}/${m.maxHp}</div></button>`;
}
function renderPartyBar(sel, inBattle){
  const run=R.run;
  const act = run.party.slice(0,ACTIVE_N).map((m,i)=>
    monChip(m,i, inBattle && R.g && R.g.sides[0].active===i ? ' act' : '')).join('');
  const bench = run.party.slice(ACTIVE_N);
  $(sel).innerHTML = inBattle ? act
    : `<div class="prow"><span class="plab">出戰</span>${act}</div>`
      + (bench.length ? `<div class="prow"><span class="plab bn">後備</span>${
          bench.map((m,i)=>monChip(m,i+ACTIVE_N,' bench')).join('')}</div>` : '');
}

function enterNode(node){
  const run=R.run;
  if($('#sheet').classList.contains('on')) return;   // 有彈窗開住就唔好再入節點
  run.map.cur=node; run.map.done.push(node.id);
  R.node=node;
  let kind=node.type;
  if(kind==='unknown'){
    const roll=rnd(100);
    /* 第 2 章開始，未知節點有低機率變成神獸挑戰 */
    if(run.act>=2 && roll<8) kind='legend';
    else if(roll<48) kind='mob';
    else if(roll<66) kind='chest';
    else if(roll<86) kind='rest';
    else kind='shop';
  }
  R.kind=kind;
  if(kind==='mob'||kind==='elite'||kind==='boss'||kind==='legend') startRogueBattle(kind);
  else if(kind==='rest') openRest();
  else if(kind==='shop') openShop();
  else if(kind==='chest') openChest();
}

/* ---------------- 擲骰結果面板（唔會即刻消失） ---------------- */
function renderDicePanel(L, sel){
  const box=$(sel||'#rgDice'); if(!box) return;
  const last = L || R.lastRoll;
  if(!last){ box.innerHTML='<div class="dpEmpty">未擲骰</div>'; return; }
  const rolls=last.energyRolls[0]||[];
  box.innerHTML=`
    <div class="dpWho">${last.attacker===0?'你':'對手'}・${esc(last.move.name)}</div>
    <div class="dpDice">
      ${rolls.map(r=>`<span class="edie sm">${r.face.map(f=>tyBadge(f,1)).join('')}</span>`).join('')}
      ${last.charRolls.length?`<span class="cdie sm"><img src="data:image/png;base64,${FACE_IMG[last.charRolls[0]]}"></span>
        <span class="dpFace">${last.charRolls[0]}</span>`:'<span class="mut xs">冇角色骰</span>'}
    </div>
    <div class="dpRes ${last.success?'ok':'no'}">${last.success
      ? (last.final>0 ? `成功 −${last.final}` : '成功（0 傷害）')
      : '能量不足'}</div>`;
}

/* ---------------- 戰鬥場景 ---------------- */
/* 按對手屬性 + 章節揀背景；同一個節點唔會閃嚟閃去 */
const SCENE_BY_TYPE = {
  草:['forest','swamp'], 炎:['volcano','desert'], 水:['water','snow'],
  雷:['storm','plain'],  超:['psychic','cave'],   闘:['desert','cave'],
  悪:['swamp','cave'],   鋼:['cave','gym'],       空:['plain','storm'],
  無:['plain','forest'],
};
function sceneFor(kind, type, act, salt){
  if(kind==='boss') return 'gym';
  if(kind==='e4'||kind==='champ') return 'arena';
  const list = SCENE_BY_TYPE[type] || ['plain'];
  return list[(act + (salt||0)) % list.length];
}
function sceneCSS(key){
  const b = SCENES[key] || SCENES.plain;
  return `background-image:url(data:image/png;base64,${b})`;
}

/* ---------------- 戰鬥 ---------------- */
function startRogueBattle(kind){
  const run=R.run;
  R.winBooked=false; R.evoDone=false; R.caught=false;
  const enemy = buildEnemy(run, kind);
  if(kind==='legend') toast('⚡ 傳說寶可夢出現！');
  R.scene = kind==='legend' ? 'psychic' : sceneFor(kind, enemy.party[0].spec.type, run.act, (run.map.done||[]).length);
  R.g = battleStart(run, enemy);
  R.enemyName = enemy.name + (enemy.title?`・${enemy.title}`:'');
  R.busy=false;
  renderRgBattle(); show('rgBattle');
  if(R.g.turn===1) setTimeout(enemyTurn, 700);
}
function renderRgBattle(){
  const g=R.g; if(!g) return;
  syncActive(g);
  const me=g.p[0], op=g.p[1];
  const rs=g.rs;
  $('#rgFoeInfo').innerHTML=`<div class="row sp"><div>${tyBadge(op.spec.type)} <b>${op.spec.name}</b>
      <span class="mut">${esc(R.enemyName)}・弱 ${TYPES[op.spec.weak].n}</span></div><div class="hp">${op.hp}</div></div>
    <div class="${hpCls(op)}"><i style="width:${op.hp/op.maxHp*100}%"></i></div>
    <div class="mut st">剩 ${aliveOf(g.sides[1]).length} 隻${op.guard?`　🛡${op.guard}`:''}${op.immune?'　🛡免疫':''}</div>`;
  $('#rgMeInfo').innerHTML=`<div class="row sp"><div>${tyBadge(me.spec.type)} <b>${me.spec.name}</b>
      <span class="mut">弱 ${TYPES[me.spec.weak].n}</span></div><div class="hp">${me.hp}</div></div>
    <div class="${hpCls(me)}"><i style="width:${me.hp/me.maxHp*100}%"></i></div>`;
  renderDicePanel();
  const ar=$('#rgArena');
  ar.className='arena scene';
  ar.setAttribute('style', sceneCSS(R.scene||'plain'));
  ar.innerHTML=`
    <div class="fighter foe"><img id="spriteFoe" class="bspr flip" src="${monURL(op.spec)}"></div>
    <div class="fighter mine"><img id="spriteMe" class="bspr" src="${monURL(me.spec)}"></div>
    <div class="arenaMsg" id="arenaMsg"></div>`;
  renderPartyBar('#rgParty', true);
  $$('#rgParty .pmon').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.mi;
    if(R.busy || g.turn!==0) return;
    if(R.run.party[i].hp<=0){ toast('佢已經倒下',1); return; }
    if(i===g.sides[0].active){ toast('佢已經上場緊'); return; }
    doSwitch(i);
  });

  let n=3+me.pendingDiceMod+(rs.dice||0);
  if(g.turnNo===0 && g.turn===g.first && !rs.first) n-=1;
  n=Math.max(0,Math.min(8,n));
  $('#rgTurnInfo').innerHTML = g.turn===0
    ? `第 ${g.turnNo+1} 回合・能量骰 ${n} 粒${me.pendingLock?`<br><span class="hl">「${me.pendingLock}」被封鎖</span>`:''}`
    : `第 ${g.turnNo+1} 回合・<span class="hl">對手行動中</span>`;

  const hand=$('#rgHand'); hand.innerHTML='';
  if(R.busy){ hand.innerHTML='<div class="waiting">…</div>'; return; }
  if(g.turn!==0){ hand.innerHTML='<div class="waiting">⏳ 對手諗緊…</div>'; return; }
  me.deck.forEach((m,i)=>{
    const banned=(me.lastMove&&me.lastMove.name===m.name)||(me.pendingLock===m.name);
    const d=el('div','mv'+(banned?' dis':''));
    d.innerHTML=moveCardHTML(m, banned?`<div class="eff bad">✕ 呢回合唔用得</div>`:'');
    if(!banned) d.onclick=()=>doRogueMove(i);
    hand.appendChild(d);
  });
  const sw=el('div','mut xs center', R.g.rs.freeSwap?'撳下面隊伍圖示換人（交換球：換人免費）':'撳下面隊伍圖示換人（會消耗呢個回合）');
  hand.appendChild(sw);
}
async function doSwitch(i){
  const g=R.g;
  R.busy=true; renderRgBattle();
  const free=g.rs.freeSwap;
  partySwitch(g,0,i);
  const msg=$('#arenaMsg');
  if(msg){ msg.innerHTML=`<div class="mvName">換人：${R.run.party[i].spec.name}！</div>`; }
  await sleep(650);
  R.busy=false; renderRgBattle();
  if(!free && g.turn===1) setTimeout(enemyTurn, 600);
}
async function doRogueMove(i){
  const g=R.g; if(R.busy||g.turn!==0) return;
  const me=g.p[0], move=me.deck[i];
  let lock=null;
  if((move.faces||[]).some(f=>f.ops.some(o=>o.t==='lock'))){
    lock=await chooseLock(g.p[1]); if(lock===null) return;
  }
  R.busy=true; renderRgBattle();
  await resolveRogueTurn(i, lock);
  R.busy=false;
  if(g.over){ endRogueBattle(); return; }
  renderRgBattle();
  if(g.turn===1) setTimeout(enemyTurn, 500);
}
async function enemyTurn(){
  const g=R.g; if(!g||g.over||g.turn!==1) return;
  const sw=enemyMaybeSwitch(g);
  if(sw>=0){
    R.busy=true; renderRgBattle();
    const nm=g.sides[1].party[sw].spec.name;
    partySwitch(g,1,sw);
    const msg=$('#arenaMsg'); if(msg) msg.innerHTML=`<div class="mvName">對手換上 ${nm}！</div>`;
    await sleep(700); R.busy=false; renderRgBattle();
    return;
  }
  R.busy=true; renderRgBattle();
  await resolveRogueTurn(enemyChoose(g), rnd(4));
  R.busy=false;
  if(g.over){ endRogueBattle(); return; }
  renderRgBattle();
  if(g.turn===1) setTimeout(enemyTurn, 500);
}

async function resolveRogueTurn(moveIdx, lock){
  const g=R.g;
  const atk=g.turn;
  const rs=g.rs;
  /* 遺物：多擲骰 */
  if(atk===0 && rs.dice) g.p[0].pendingDiceMod += rs.dice;
  if(atk===0 && rs.first && g.turnNo===0 && g.turn===g.first) g.p[0].pendingDiceMod += 1;
  const L = partyTurn(g, moveIdx, lock, newSeed());
  await animateRogue(L, atk);
  /* 倒下處理 */
  for(const f of (L.faint||[])){
    const node=document.getElementById(f.side===0?'spriteMe':'spriteFoe');
    if(node){ node.classList.add('faintAnim'); await sleep(600); }
    toast(`${f.mon.spec.name} 倒下咗`, f.side===0);
  }
  syncActive(g);
}
async function animateRogue(L, atkSide){
  R.lastRoll = L;
  const atkNode=document.getElementById(atkSide===0?'spriteMe':'spriteFoe');
  const defNode=document.getElementById(atkSide===0?'spriteFoe':'spriteMe');
  const msg=$('#arenaMsg'); if(!msg) return;
  const rolls=L.energyRolls[0]||[];
  msg.innerHTML=`<div class="mvName">${esc(L.move.name)}</div>
    <div class="dieRow">${rolls.map(()=>`<div class="edie roll">?</div>`).join('')}<div class="cdie roll"></div></div>`;
  await sleep(620);
  msg.innerHTML=`<div class="mvName">${esc(L.move.name)}</div>
    <div class="dieRow">${rolls.map(r=>`<div class="edie">${r.face.map(f=>tyBadge(f,1)).join('')}</div>`).join('')}
    ${L.charRolls.length?`<div class="cdie"><img src="data:image/png;base64,${FACE_IMG[L.charRolls[0]]}"></div>`:''}</div>
    <div class="verdict ${L.success?'ok':'no'}">${L.success?'發動成功':'能量不足'}</div>`;
  renderDicePanel(L);
  await sleep(1150);
  if(!L.success){ msg.innerHTML=''; await playFizzle(atkNode); }
  else{
    msg.innerHTML='';
    await playAttack(L.move.type, atkNode, defNode, {hit:L.final>0, big:L.final>=60});
    if(L.final>0) popDamage(defNode,'-'+L.final, L.weak?'weak':'');
    else popDamage(defNode,'0','zero');
    if(L.heal){ await playBuff(atkNode,'heal'); popDamage(atkNode,'+'+L.heal,'heal'); }
    if(L.selfDmg) popDamage(atkNode,'-'+L.selfDmg,'self');
  }
  renderHPBars();
  renderDicePanel(L);
  await sleep(520);
  if(L.steps.length){
    msg.innerHTML=`<div class="log">${L.steps.map(s=>`<div>${s.fail?'✕ ':'• '}${esc(s.msg)}</div>`).join('')}</div>`;
    await sleep(atkSide===0?900:1200);
  }
  msg.innerHTML='';
}
function renderHPBars(){
  const g=R.g; if(!g) return;
  const me=g.p[0], op=g.p[1];
  const set=(sel,pl)=>{ const n=$(sel); if(!n) return;
    n.querySelector('.hp').textContent=Math.max(0,pl.hp);
    const b=n.querySelector('.hpbar'); b.className=hpCls(pl);
    b.querySelector('i').style.width=Math.max(0,pl.hp/pl.maxHp*100)+'%'; };
  set('#rgFoeInfo',op); set('#rgMeInfo',me);
  renderPartyBar('#rgParty', true);
}

function endRogueBattle(){
  const g=R.g, run=R.run;
  if(g.winner!==0) return rogueOver(false);

  /* 勝利結算：拎球 + 參戰隊員記勝場（只做一次） */
  if(!R.winBooked){
    R.winBooked = true;
    afterWin(run, [...(g.fought||[])]);
    toast(`+${BALL_PER_WIN} 個精靈球（共 ${run.balls}）`);
  }
  /* 進化檢查 */
  if(!R.evoDone){ R.evoDone=true; return runEvolutions(()=>endRogueBattle()); }
  if(R.kind==='champ'){ R.winBooked=false; R.evoDone=false; return rogueOver(true); }
  /* 捕捉：雜魚 / 精英 / 神獸戰之後 */
  if(!R.caught && (R.kind==='mob'||R.kind==='elite'||R.kind==='legend')){
    const mon=catchOffer(run, {party:g.sides[1].party}, R.kind);
    if(mon){ R.caught=true; return offerCatch(mon, ()=>{ R.caught=false; endRogueBattle(); }); }
  }
  R.caught=false; R.winBooked=false; R.evoDone=false;

  const rs=relicSum(run);
  if(R.kind!=='e4') postFightRecover(run);
  else run.party.forEach(m=>{ if(m.hp>0) m.hp=Math.min(m.maxHp, m.hp+Math.round(m.maxHp*E4_HEAL)); });
  const kind = R.kind==='e4' ? 'e4' : (R.kind==='legend' ? 'elite' : R.kind);
  const gold = goldFor(kind, run.act) + (rs.gold||0);
  run.gold += gold;
  if(R.kind==='e4'){ run.e4++; R.e4Pending=true; }
  R.rewardGold = gold;
  R.rewards = rollRewards(run, (R.kind==='boss'||R.kind==='e4') ? 'boss' : R.kind);
  renderReward(); show('rgReward');
}

/* ---------------- 捕捉（投精靈球） ---------------- */
function offerCatch(mon, after){
  const run=R.run;
  const st = { dex: mon.spec.dex, miss:0, tries:0 };
  const rate = catchRate(st.dex);
  const legend = isLegend(st.dex);

  const draw=(msg, cls)=>{
    const full = run.party.length>=PARTY_MAX;
    sheetOpen(`<h2>${legend?'✨ 傳說寶可夢':'⚪ 遇到野生寶可夢'}</h2>
      <div class="row mb"><img class="spr big" src="${monURL(mon.spec)}">
        <div><b>${esc(mon.spec.name)}</b> ${tyBadge(mon.spec.type,1)}${legend?'<span class="badge">神獸</span>':''}<br>
        <span class="mut xs">捕捉率 ${(rate*100).toFixed(0)}%・HP ${mon.hp}/${mon.maxHp}</span></div></div>
      <div class="ballBar">
        <span class="ballIcon">⚪</span><b>${run.balls}</b> 個精靈球
        <span class="missDots">${Array.from({length:MAX_MISS},(_,i)=>
          `<i class="${i<st.miss?'on':''}"></i>`).join('')}</span>
        <span class="mut xs">連續失敗 ${st.miss}/${MAX_MISS}</span>
      </div>
      ${msg?`<div class="catchMsg ${cls||''}">${msg}</div>`:''}
      <div class="mvmini mb">${mon.deck.map(m=>`<span>${tyBadge(m.type,1)}${esc(m.name)} <b>${m.dmg==null?'—':m.dmg}</b></span>`).join('')}</div>
      <div class="row">
        <button class="btn sec sm" id="catchNo">唔捉喇</button>
        <button class="btn sm" id="catchThrow" ${run.balls<=0?'disabled':''}>投球（-1）</button>
      </div>
      ${full?'<div class="hint">隊伍已經滿 6 隻，捉到之後要放走一隻。</div>':''}`);
    $('#catchNo').onclick=()=>{ sheetClose(); after&&after(); };
    const th=$('#catchThrow');
    if(th) th.onclick=()=>{
      const r=throwBall(run, st);
      if(r==='noball')  return draw('冇精靈球喇','bad');
      if(r==='miss')    return draw(`差少少！走咗出嚟（剩 ${run.balls} 球）`,'bad');
      if(r==='flee'){
        sheetClose(); toast(mon.spec.name+' 走甩咗…',1); after&&after(); return;
      }
      /* 捉到 */
      if(run.party.length < PARTY_MAX){
        addToParty(run, mon);
        sheetClose(); toast('捉到 '+mon.spec.name+'！'); after&&after();
      } else pickRelease(mon, after);
    };
  };
  draw(legend?'神獸好難捉，慳定球先好挑戰。':'');
}
function pickRelease(mon, after){
  const run=R.run;
  sheetOpen(`<h2>隊伍滿了</h2>
    <div class="mut mb">捉到 <b>${esc(mon.spec.name)}</b>，但隊伍已經有 6 隻。揀一隻放走。</div>
    <div class="pmgr">${run.party.map((m,i)=>`

function runEvolutions(after){
  const run=R.run;
  const list = pendingEvolutions(run);
  if(!list.length) return after&&after();
  const one = list[0];
  const targets = Array.isArray(one.to) ? one.to : [one.to];
  const doEvo = (toDex)=>{
    const from = one.mon.spec.name;
    evolveMon(one.mon, toDex);
    sheetOpen(`<h2>✨ 進化！</h2>
      <div class="evoRow">
        <div><img class="spr big" src="${dexURL(DEX[one.mon.dex].n===toDex?toDex:toDex)}"></div>
      </div>
      <div class="center" style="margin:8px 0">

      <div class="mut xs center mb">最大 HP +${EVO_HP_GAIN}、所有招式傷害 +${EVO_DMG_GAIN}、弱點變成 ${TYPES[one.mon.spec.weak].n}</div>
      <button class="btn" id="evoOk">好嘢！</button>`);
    $('#evoOk').onclick=()=>{ sheetClose(); runEvolutions(after); };
  };
  if(targets.length===1) return doEvo(targets[0]);

  sheetOpen(`<h2>✨ ${esc(one.mon.spec.name)} 想進化</h2>

    <div class="pmgr">${targets.map(dx=>`
      <button class="pcardm" data-dx="${dx}"><img class="spr big" src="${dexURL(dx)}">

/* 跑局內嘅骰面改裝（直接改隊員嘅 loadout） */
function openRunDice(pi){
  const run=R.run;
  if(pi==null){
    sheetOpen(`<h2>揀邊隻改裝？</h2>`+run.party.map((m,i)=>
      `<button class="rwcard" data-p="${i}"><div class="row"><img class="spr" src="${monURL(m.spec)}">
        <div><b>${m.spec.name}</b><br><span class="mut">${tyBadge(m.spec.type,1)} HP ${Math.max(0,m.hp)}/${m.maxHp}</span></div></div></button>`).join('')

    $$('#sheetIn [data-p]').forEach(b=>b.onclick=()=>openRunDice(+b.dataset.p));
    $('#rdCancel').onclick=sheetClose;
    return;
  }
  const mon=run.party[pi], D=DICE[cardOf(mon).id];
  let slot=null;
  const draw=()=>{
    const used=new Set(mon.loadout.flat());
    sheetOpen(`<h2>${mon.spec.name} 骰面改裝</h2>
      <div class="mut mb">撳骰面 → 撳晶片</div>
      ${mon.loadout.map((die,di)=>`<div class="fdie"><div class="fdh">能量骰 ${di+1}</div>
        <div class="fslots">${D.fixed[di].map(x=>`<div class="fslot fix">${chipHTML(x)}<i>固定</i></div>`).join('')}
        ${die.map((ci,si)=>`<button class="fslot pick${slot&&slot[0]===di&&slot[1]===si?' act':''}" data-d="${di}" data-s="${si}">${chipHTML(D.chips[ci])}</button>`).join('')}</div></div>`).join('')}
      <div class="mut" style="margin:8px 0 5px">改裝晶片</div>
      <div class="chips">${D.chips.map((c,i)=>`<button class="chip${used.has(i)?' used':''}" data-i="${i}">${chipHTML(c)}</button>`).join('')}</div>
      <button class="btn sm mt" id="rdDone">完成</button>`);
    $$('#sheetIn .fslot.pick').forEach(b=>b.onclick=()=>{ slot=[+b.dataset.d,+b.dataset.s]; draw(); });
    $$('#sheetIn .chip').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(!slot){ toast('先撳一格骰面'); return; }
      if(used.has(i)){ toast('呢塊已經用咗',1); return; }
      mon.loadout[slot[0]][slot[1]]=i;
      mon.dice=buildDice(cardOf(mon).id, mon.loadout);
      slot=null; draw();
    });
    $('#rdDone').onclick=()=>{ sheetClose(); advanceAfterNode(); };
  };
  draw();
}

function openShop(){
  const run=R.run, rs=relicSum(run);
  const disc = 1-(rs.discount||0);
  const items=[];
  relicRewards(run,3).forEach(r=>items.push({...r, cost:Math.round((110+rnd(70))*disc)}));
  const mu=moveUpgrades(run); if(mu.length){ const u=mu[rnd(mu.length)]; items.push({...u, cost:Math.round((70+rnd(40))*disc)}); }
  const cu=chipUpgrades(run); if(cu.length){ const u=cu[rnd(cu.length)]; items.push({...u, cost:Math.round((60+rnd(40))*disc)}); }
  items.push({ kind:'heal', n:'傷藥：全隊回復 40 HP', d:'即時使用', cost:Math.round(60*disc),
    apply(run){ run.party.forEach(m=>{ if(m.hp>0) m.hp=Math.min(m.maxHp,m.hp+40); }); } });
  R.shop=items;
  renderShop(); show('rgShop');
}
function renderShop(){
  const run=R.run;
  $('#rgShopGold').textContent=run.gold;
  const box=$('#rgShopList'); box.innerHTML='';
  R.shop.forEach((it,i)=>{
    if(it.sold) return;
    const d=el('button','rwcard'+(run.gold<it.cost?' dis':''));
    d.innerHTML=`<div class="rwk">${it.kind==='relic'?'🏅 遺物':it.kind==='chip'?'🎲 晶片':it.kind==='heal'?'🧪 道具':'⬆️ 強化'}
        <span class="price">${it.cost} 金</span></div>
      <div class="rwn">${esc(it.n)}</div><div class="rwd">${esc(it.d)}</div>`;
    if(run.gold>=it.cost) d.onclick=()=>{
      if(it.kind==='chip'){ R.chipPick=it; R.shopBuying=i; return openChipPickShop(); }
      run.gold-=it.cost; it.apply(run); it.sold=true; toast('買咗 '+it.n); renderShop();
    };
    box.appendChild(d);
  });
  if(!R.shop.some(it=>!it.sold)) box.innerHTML='<div class="mut center">賣曬喇</div>';
}
function openChipPickShop(){
  const it=R.shop[R.shopBuying];
  openChipPick();
  const orig=$$('#sheetIn .fslot.pick');
  orig.forEach(b=>b.onclick=()=>{
    R.run.gold-=it.cost; it.apply(R.run,{die:+b.dataset.d, slot:+b.dataset.s});
    it.sold=true; sheetClose(); R.chipPick=null; toast('買咗 '+it.n); renderShop();
  });
}
function openChest(){

}

    $('#pvCreate').onclick=async()=>{
      try{ await roomCreate(); await RM.ref.update({ mode:'tower' });
        RM.onChange=onPvpRoom; renderPvp(); }catch(e){ toast(e.message,1); }
    };
    $('#pvJoin').onclick=async()=>{
      const c=$('#pvCode').value; if(!c){ toast('入房間碼先',1); return; }
      try{ await roomJoin(c); RM.onChange=onPvpRoom; renderPvp(); }catch(e){ toast(e.message,1); }
    };
    return;
  }

  const d=RM.data||{};
  const meS=d[RM.side]||{}, other=d[RM.side==='host'?'guest':'host'];
  const oSnap = other && other.setup;
  box.innerHTML=`
    <div class="codeBox"><span class="mut">房間碼</span><b>${RM.code}</b>
      <button class="lnk" id="pvCopy">複製</button></div>
    <div class="lobby">
      <div class="lp ${meS.ready?'rdy':''}">
        <b>${esc(meS.nick||myNick())}</b>${RM.side==='host'?'<span class="badge">房主</span>':''}
        <div class="powerTag">戰力 ${PV.snap.power}</div>
        <div class="mut xs">第 ${PV.snap.act} 章</div>
        <div class="teamRow mt">${PV.snap.party.map(p=>`<img class="spr" src="${dexURL(p.dex)}">`).join('')}</div>
      </div>
      <div class="vs">VS</div>
      <div class="lp ${other&&other.ready?'rdy':''}">
        <b>${other?esc(other.nick):'等緊對手…'}</b>
        ${oSnap?`<div class="powerTag">戰力 ${oSnap.power}</div>
          <div class="mut xs">第 ${oSnap.act} 章</div>
          <div class="teamRow mt">${(oSnap.party||[]).map(p=>`<img class="spr" src="${dexURL(p.dex)}">`).join('')}</div>`
          :'<div class="mut xs">將房間碼畀佢</div>'}
      </div>
    </div>
    ${oSnap ? powerHint(PV.snap.power, oSnap.power) : ''}
    <button class="btn" id="pvReady">${meS.ready?'已準備（可以再送一次）':'準備：送出我嘅隊伍'}</button>
    ${RM.side==='host'?`<button class="btn sm mt" id="pvStart" ${(meS.ready&&other&&other.ready)?'':'disabled'}>開戰</button>`
      :'<div class="mut center mt">等房主開戰</div>'}
    <button class="btn sec sm mt" id="pvLeave">離開房間</button>`;
  $('#pvCopy').onclick=()=>{ try{ navigator.clipboard.writeText(RM.code); toast('已複製 '+RM.code); }catch(e){} };
  $('#pvReady').onclick=async()=>{
    await RM.ref.child(RM.side).update({ ready:true, nick:myNick(), setup:PV.snap });
    await RM.ref.child('updatedAt').set(Date.now());
    toast('已送出隊伍');
  };
  $('#pvLeave').onclick=async()=>{ await roomLeave(); RM.onChange=null; renderPvp(); };
  const st=$('#pvStart');
  if(st) st.onclick=async()=>{
    await roomUpd({ state:'battle', mode:'tower',
      setup:{ p0:d.host.setup, p1:d.guest.setup, first:Math.floor(Math.random()*2) } });
  };
}
function powerHint(a,b){
  const diff = Math.abs(a-b), hi = Math.max(a,b);
  const pct = hi ? diff/hi : 0;
  if(pct < 0.12) return `<div class="hint">戰力接近，公平局。</div>`;
  const who = a>b ? '你' : '對手';
  return `<div class="hint">戰力差 ${diff}（${(pct*100).toFixed(0)}%），${who}明顯佔優。想公平啲可以等大家爬到差唔多章節先打。</div>`;
}

/* ---------- 房間變化 ---------- */
async function onPvpRoom(d){
  if(!d){
    if(S.screen==='pvpBattle') toast('對手離開咗',1);
    RM.code=null; RM.onChange=null; roomDetach();
    renderPvp(); show('pvpLobby'); return;
  }
  if(d.state==='lobby'){ if(S.screen==='pvpLobby') renderPvp(); return; }
  if(d.state!=='battle' || !d.setup) return;

  PV.myIdx = RM.side==='host' ? 0 : 1;
  if(!PV.g || PV.code!==RM.code){
    PV.g = pvpStart({ p0:d.setup.p0, p1:d.setup.p1, first:+d.setup.first||0 });
    PV.code = RM.code; PV.applied = 0;
    renderPvpBattle(); show('pvpBattle');
  }
  if(PV.busy){ PV.dirty = true; return; }
  PV.busy = true;
  try{
    do{
      PV.dirty = false;
      const acts = RM.data && RM.data.actions
        ? Object.keys(RM.data.actions).sort().map(k=>RM.data.actions[k]) : [];
      const pend = acts.slice(PV.applied);
      for(const a of pend){
        const L = pvpStep(PV.g, a);
        PV.applied++;
        if(L && !L.switched) await animatePvp(L);
        else if(L) { toast(`${L.side===PV.myIdx?'你':'對手'}換上 ${L.name}`); renderPvpBattle(); await sleep(500); }
        const w = pvpWinner(PV.g);
        if(w!==null){ PV.g.over=true; PV.g.winner=w; break; }
      }
    } while(PV.dirty && !PV.g.over);
  } finally { PV.busy = false; }

  if(PV.g.over) return pvpOver();
  if(S.screen==='pvpBattle') renderPvpBattle();
}

/* ---------- 戰鬥畫面（借用爬塔嗰套） ---------- */
function renderPvpBattle(){
  const g=PV.g; if(!g) return;
  g.p[0]=g.sides[0].party[g.sides[0].active];
  g.p[1]=g.sides[1].party[g.sides[1].active];
  const me=g.p[PV.myIdx], op=g.p[1-PV.myIdx];
  const mySide=g.sides[PV.myIdx], opSide=g.sides[1-PV.myIdx];
  const myTurn = g.turn===PV.myIdx;

  $('#pvpFoeInfo').innerHTML=`<div class="row sp"><div>${tyBadge(op.spec.type)} <b>${op.spec.name}</b>
      <span class="mut">${esc(opSide.name)}・弱 ${TYPES[op.spec.weak].n}</span></div><div class="hp">${Math.max(0,op.hp)}</div></div>
    <div class="${hpCls(op)}"><i style="width:${Math.max(0,op.hp/op.maxHp*100)}%"></i></div>
    <div class="mut st">剩 ${opSide.party.filter(m=>m.hp>0).length} 隻${op.guard?`　🛡${op.guard}`:''}</div>`;
  $('#pvpMeInfo').innerHTML=`<div class="row sp"><div>${tyBadge(me.spec.type)} <b>${me.spec.name}</b>
      <span class="mut">你・弱 ${TYPES[me.spec.weak].n}</span></div><div class="hp">${Math.max(0,me.hp)}</div></div>
    <div class="${hpCls(me)}"><i style="width:${Math.max(0,me.hp/me.maxHp*100)}%"></i></div>`;
  const ar=$('#pvpArena');
  ar.className='arena scene';
  ar.setAttribute('style', sceneCSS('arena'));
  ar.innerHTML=`<div class="fighter foe"><img id="spriteFoe" class="bspr flip" src="${monURL(op.spec)}"></div>
    <div class="fighter mine"><img id="spriteMe" class="bspr" src="${monURL(me.spec)}"></div>
    <div class="arenaMsg" id="arenaMsg"></div>`;
  renderDicePanel(PV.lastRoll, '#pvpDice');

  $('#pvpParty').innerHTML = mySide.party.map((m,i)=>
    monChip(m, i, i===mySide.active?' act':'')).join('');
  $$('#pvpParty .pmon').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.mi;
    if(PV.busy||PV.sending||!myTurn) return;
    if(mySide.party[i].hp<=0){ toast('佢已經倒下',1); return; }
    if(i===mySide.active){ toast('佢已經上場緊'); return; }
    sendPvpAction({ type:'switch', idx:i });
  });
  $('#pvpTurnInfo').innerHTML = myTurn ? `第 ${g.turnNo+1} 回合・輪到你`
    : `第 ${g.turnNo+1} 回合・<span class="hl">等對手</span>`;

  const hand=$('#pvpHand'); hand.innerHTML='';
  if(PV.sending){ hand.innerHTML='<div class="waiting">📡 送緊出去…</div>'; return; }
  if(!myTurn){ hand.innerHTML='<div class="waiting">⏳ 等緊對手出招…</div>'; return; }
  me.deck.forEach((m,i)=>{
    const banned=(me.lastMove&&me.lastMove.name===m.name)||(me.pendingLock===m.name);
    const d=el('div','mv'+(banned?' dis':''));
    d.innerHTML=moveCardHTML(m, banned?'<div class="eff bad">✕ 呢回合唔用得</div>':'');
    if(!banned) d.onclick=async()=>{
      let lock=null;
      if((m.faces||[]).some(f=>f.ops.some(o=>o.t==='lock'))){
        lock=await chooseLock(g.p[1-PV.myIdx]); if(lock===null) return;
      }
      sendPvpAction({ type:'move', moveIdx:i, lockChoice:lock, seed:newSeed() });
    };
    hand.appendChild(d);
  });
  hand.appendChild(el('div','mut xs center','撳下面隊伍圖示換人（消耗一個回合）'));
}
async function sendPvpAction(a){
  if(PV.sending||PV.busy) return;
  PV.sending=true; renderPvpBattle();
  try{ await roomPushAction({ ...a, by:RM.side, ts:Date.now() }); }
  catch(e){ toast('送唔到出去：'+e.message,1); }
  PV.sending=false;
  onPvpRoom(RM.data);
}
async function animatePvp(L){
  PV.lastRoll = L;
  const atkIsMe = L.attacker===PV.myIdx;
  const atkNode=document.getElementById(atkIsMe?'spriteMe':'spriteFoe');
  const defNode=document.getElementById(atkIsMe?'spriteFoe':'spriteMe');
  const msg=$('#arenaMsg'); if(!msg) return;
  const rolls=L.energyRolls[0]||[];
  msg.innerHTML=`<div class="mvName">${esc(L.move.name)}</div>
    <div class="dieRow">${rolls.map(()=>'<div class="edie roll">?</div>').join('')}<div class="cdie roll"></div></div>`;
  await sleep(560);
  msg.innerHTML=`<div class="mvName">${esc(L.move.name)}</div>
    <div class="dieRow">${rolls.map(r=>`<div class="edie">${r.face.map(f=>tyBadge(f,1)).join('')}</div>`).join('')}
    ${L.charRolls.length?`<div class="cdie"><img src="data:image/png;base64,${FACE_IMG[L.charRolls[0]]}"></div>`:''}</div>
    <div class="verdict ${L.success?'ok':'no'}">${L.success?'發動成功':'能量不足'}</div>`;
  renderDicePanel(L, '#pvpDice');
  await sleep(1100);
  if(!L.success){ msg.innerHTML=''; await playFizzle(atkNode); }
  else{
    msg.innerHTML='';
    await playAttack(L.move.type, atkNode, defNode, {hit:L.final>0, big:L.final>=60});
    if(L.final>0) popDamage(defNode,'-'+L.final, L.weak?'weak':'');
    if(L.heal){ await playBuff(atkNode,'heal'); popDamage(atkNode,'+'+L.heal,'heal'); }
    if(L.selfDmg) popDamage(atkNode,'-'+L.selfDmg,'self');
  }
  renderPvpBattle();
  await sleep(450);
}
function pvpOver(){
  const g=PV.g;
  const win = g.winner===PV.myIdx;
  $('#rgOverTitle').textContent = g.winner===-1 ? '平手！' : (win?'🏆 你贏咗！':'你輸咗…');
  $('#rgOverSub').innerHTML = `爬塔隊伍對戰<br>
    <div class="teamRow mt">${g.sides[PV.myIdx].party.map(m=>`<div class="tslot">
      <img class="spr" src="${monURL(m.spec)}"><div class="xs">${Math.max(0,m.hp)}/${m.maxHp}</div></div>`).join('')}</div>
    <div class="mut xs mt">呢場唔會影響你嘅爬塔進度</div>`;
  $('#rgOverAgain').style.display='none';
  if(FB.user){
    try{ FB.db.ref('users/'+FB.user.uid+'/pvp').transaction(v=>{
      v=v||{w:0,l:0}; if(g.winner!==-1){ win?v.w++:v.l++; } return v; }); }catch(e){}
  }
  PV.g=null; PV.code=null;
  show('rgOver');
}

function bindPvp(){
  $('#pvpBack').onclick=async()=>{ if(RM.code){ await roomLeave(); RM.onChange=null; } show('title'); };
}
</script>

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
